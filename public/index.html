<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Desenho Assinado</title>
  <link rel="stylesheet" href="style.css">
  
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <main>
    <header>
      <h1>Desenho Assinado</h1>
      <p>Escolha um número entre 1 e 100. Cada número gera uma figura diferente, assinada com o seu e-mail do Google.</p>
    </header>

    <form id="formulario" novalidate>
      <label for="numero">Número</label>
      <input id="numero" name="numero" type="number" min="1" max="100" step="1" required placeholder="42">
      
      <div id="g_id_onload"
         data-client_id="791865911584-1o8vmjep8rnrmj5majk3i6aahkq3gn88.apps.googleusercontent.com"
         data-callback="handleCredentialResponse"
         data-auto_prompt="false">
      </div>
      <div class="g_id_signin"
         data-type="standard"
         data-size="large"
         data-theme="outline"
         data-text="sign_in_with"
         data-shape="rectangular"
         data-logo_alignment="left">
      </div>

      <button type="submit" style="margin-top: 15px;">Desenhar</button>
    </form>

    <p id="mensagem" role="alert"></p>

    <figure id="desenho" aria-live="polite"></figure>

    <button id="baixar" type="button" hidden>Baixar SVG</button>
  </main>

  <script>
    // Função e variável globais exigidas pelo Google Identity Services
    window.googleIdToken = "";
    window.handleCredentialResponse = function(response) {
      window.googleIdToken = response.credential;
      const mensagem = document.getElementById("mensagem");
      if (mensagem) {
        mensagem.textContent = "Autenticado com sucesso pelo Google!";
        mensagem.style.color = "green";
      }
    };
  </script>
  <script src="script.js"></script>
</body>
</html>
